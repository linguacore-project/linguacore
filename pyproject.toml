[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linguacore"
version = "0.3.0"
description = "Evidence-first infrastructure for language documentation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/linguacore"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
