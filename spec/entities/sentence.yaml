code: SEN-0001
name: Sentence
inherits: Resource
description: A segment of linguistic text that may carry translations, annotations and evidence links.
fields:
  text_id: {type: uuid, required: false}
  sequence: {type: integer, required: true, minimum: 1}
  transcription: {type: string, required: true}
  normalized_text: {type: string, required: false}
  translation_pt: {type: string, required: false}
  translation_en: {type: string, required: false}
  speaker_id: {type: uuid, required: false}
  start_ms: {type: integer, required: false, minimum: 0}
  end_ms: {type: integer, required: false, minimum: 0}
rules:
  - end_ms must be greater than start_ms when both are supplied.
  - Publication requires at least one provenance record.
